name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validation globale (Lint, Types, Taille D-13, Tests, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opensio
          POSTGRES_USER: opensio
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://opensio:ci@localhost:5432/opensio
      JWT_SECRET: ci-dummy-secret-pour-tests-uniquement-pas-un-vrai-secret-64chars
      REGISTRATION_ENABLED: "true"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Génération du client Prisma
        run: pnpm --filter @opensio/api exec prisma generate

      - name: Application des migrations PostgreSQL
        run: pnpm --filter @opensio/api exec prisma migrate deploy

      - name: Contrôle de la taille des fichiers (Règle D-13 / RM-13)
        run: node scripts/check-file-size.mjs

      - name: Linting
        run: pnpm lint

      - name: Vérification des types TypeScript
        run: pnpm typecheck

      - name: Tests unitaires et d'intégration
        run: pnpm test

      - name: Build des applications et packages
        run: pnpm build
