name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validation globale (Lint, Types, Taille D-13, Tests, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: opensio_test
          POSTGRES_USER: opensio
          POSTGRES_PASSWORD: opensio-super-secure-dev-db-pass-2026!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://opensio:opensio-super-secure-dev-db-pass-2026!@localhost:5432/opensio_test
      DB_PASSWORD: opensio-super-secure-dev-db-pass-2026!
      JWT_SECRET: ci-dummy-secret-pour-tests-uniquement-pas-un-vrai-secret-64chars
      REGISTRATION_ENABLED: "true"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Génération du client Prisma
        run: pnpm --filter @opensio/api exec prisma generate

      - name: Application des migrations PostgreSQL (Base de test)
        run: pnpm --filter @opensio/api exec prisma migrate deploy

      - name: Contrôle de la taille des fichiers (Règle D-13 / RM-13)
        run: node scripts/check-file-size.mjs

      - name: Contrôle des classes bi-thème (Thème Clair / Sombre)
        run: node scripts/check-theme-classes.mjs

      - name: Linting
        run: pnpm lint

      - name: Vérification des types TypeScript
        run: pnpm typecheck

      - name: Tests unitaires et d'intégration
        run: pnpm test

      - name: Vérification de la syntaxe des scripts shell (ShellCheck)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

      - name: Build des applications et packages (Monorepo)
        run: pnpm build

      - name: Validation du build des images Docker de production
        run: docker compose -f docker-compose.prod.yml build
