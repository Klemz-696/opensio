# Serveur TLS Nginx — SOLUTION INVALIDE : protocole obsolète conservé
# TLSv1.1 reste exposé : le downgrade attack reste possible (note SSL Labs B).

server {
    listen 443 ssl;
    server_name opensio.home.lan;

    ssl_certificate     /etc/nginx/pki/opensio.home.lan.crt;
    ssl_certificate_key /etc/nginx/pki/opensio.home.lan.key;

    # ERREUR : TLSv1.1 encore autorisé
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 10.10.20.1 valid=300s;

    include /etc/nginx/snippets/security-headers.conf;
}

server {
    listen 80;
    server_name opensio.home.lan;
    return 301 https://$host$request_uri;
}