# Serveur TLS Nginx — Configuration durcie (solution de référence)

server {
    listen 443 ssl;
    server_name opensio.home.lan;

    ssl_certificate     /etc/nginx/pki/opensio.home.lan.crt;
    ssl_certificate_key /etc/nginx/pki/opensio.home.lan.key;

    # Protocoles modernes uniquement (SSLv3, TLSv1, TLSv1.1 interdits)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Suites AEAD avec perfect forward secrecy
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Sessions
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # Agrafage OCSP
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 10.10.20.1 valid=300s;

    # En-têtes de sécurité HTTP
    include /etc/nginx/snippets/security-headers.conf;
}

# Redirection permanente du trafic HTTP
server {
    listen 80;
    server_name opensio.home.lan;
    return 301 https://$host$request_uri;
}