# Serveur TLS Nginx — CONFIGURATION VULNÉRABLE À CORRIGER
# Audit SSL Labs : note C. Protocoles obsolètes, suites faibles, pas d'en-têtes.

server {
    listen 443 ssl;
    server_name opensio.home.lan;

    ssl_certificate     /etc/nginx/pki/opensio.home.lan.crt;
    ssl_certificate_key /etc/nginx/pki/opensio.home.lan.key;

    # TODO 1 : restreindre aux seuls TLS 1.2 et TLS 1.3
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # TODO 2 : suites de chiffrement modernes uniquement
    # (supprimer RC4, 3DES, les suites CBC et MD5)
    ssl_ciphers HIGH:MEDIUM:!aNULL:!MD5;

    # TODO 3 : désactiver les tickets de session
    # ssl_session_tickets on;

    # TODO 4 : activer l'agrafage OCSP (ssl_stapling on / ssl_stapling_verify on)
    # avec resolver interne
}

