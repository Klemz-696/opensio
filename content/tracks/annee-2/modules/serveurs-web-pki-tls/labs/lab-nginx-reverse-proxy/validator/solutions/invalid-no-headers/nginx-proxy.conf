# Reverse Proxy Nginx — SOLUTION INVALIDE : en-têtes client non transmis
# Les logs backend et le rate limiting ne verront que l'IP du proxy.

server {
    listen 80;
    server_name opensio.home.lan;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name opensio.home.lan;

    ssl_certificate     /etc/nginx/pki/opensio.home.lan.crt;
    ssl_certificate_key /etc/nginx/pki/opensio.home.lan.key;

    location / {
        proxy_pass http://opensio_backend;

        # En-têtes transmis OUBLIÉS : X-Forwarded-For, X-Forwarded-Proto, X-Real-IP
        proxy_set_header Host $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}