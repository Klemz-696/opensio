# Reverse Proxy Nginx — Virtual Host OpenSIO (solution de référence)
# Redirection HTTP -> HTTPS puis relais vers l'upstream interne.

server {
    listen 80;
    server_name opensio.home.lan;

    # Redirection permanente vers HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name opensio.home.lan;

    ssl_certificate     /etc/nginx/pki/opensio.home.lan.crt;
    ssl_certificate_key /etc/nginx/pki/opensio.home.lan.key;

    location / {
        # Relais vers le pool de backends défini dans upstream-backends.conf
        proxy_pass http://opensio_backend;

        # Transmission de la réalité client au backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connexions persistantes vers le backend
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_read_timeout 60s;
    }
}