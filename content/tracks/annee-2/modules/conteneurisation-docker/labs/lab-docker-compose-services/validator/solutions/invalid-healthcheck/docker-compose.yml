services:
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - frontend-net
    restart: unless-stopped

  backend:
    build: .
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    networks:
      - backend-net
    restart: unless-stopped

volumes:
  db_data:

networks:
  frontend-net:
  backend-net:
