#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state invalid drop
        ct state { established, related } accept
        iif "eth0" tcp dport 22 ct state new accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state invalid drop
        ct state { established, related } accept
        iif "eth0" oif "eth1" ct state new accept
        iif "eth1" oif "eth2" ip daddr 192.168.50.10 tcp dport { 80, 443 } ct state new accept

        # Fuite de sécurité : DMZ autorisée vers LAN !
        iif "eth2" oif "eth0" accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iif "eth1" tcp dport { 80, 443 } dnat to 192.168.50.10
    }
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oif "eth1" masquerade
    }
}
