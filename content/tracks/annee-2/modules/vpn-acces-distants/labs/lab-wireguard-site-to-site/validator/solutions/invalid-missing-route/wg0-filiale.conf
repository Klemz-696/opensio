# Interface WireGuard de la FILIALE — SOLUTION INVALIDE : LAN siège absent
# Sans 192.168.10.0/24 dans AllowedIPs, les postes de la filiale ne joignent pas le siège.

[Interface]
Address = 10.99.0.2/24
ListenPort = 51820
PrivateKey = 4GhJkLzXcVbNm0=

PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT

[Peer]
PublicKey = mN0pQr=
Endpoint = 203.0.113.10:51820
AllowedIPs = 10.99.0.1/32
PersistentKeepalive = 25