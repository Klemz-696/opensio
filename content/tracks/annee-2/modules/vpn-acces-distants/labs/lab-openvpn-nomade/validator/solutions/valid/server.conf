# Serveur OpenVPN nomade — solution de référence
# LAN siège : 192.168.10.0/24 - sous-réseau VPN : 10.8.0.0/24

port 1194
proto udp
dev tun
server 10.8.0.0 255.255.255.0

# PKI d'entreprise
ca   /etc/openvpn/pki/ca-racine.pem
cert /etc/openvpn/pki/vpn-server.crt
key  /etc/openvpn/pki/vpn-server.key
dh   none
tls-crypt /etc/openvpn/pki/ta.key

# Chiffrement moderne
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM:CHACHA20-POLY1305
auth SHA256

# Poussée réseau vers les clients
push "route 192.168.10.0 255.255.255.0"
push "dhcp-option DNS 192.168.10.5"

# Durcissement et traçabilité
user nobody
group nogroup
persist-key
persist-tun
verb 3
log-append /var/log/openvpn/server.log