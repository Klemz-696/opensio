# Serveur OpenVPN — complet (fixture invalid-missing-push)
# La route du LAN n'est pas poussée : les clients connectés ne savent pas joindre 192.168.10.0/24.

port 1194
proto udp
dev tun
server 10.8.0.0 255.255.255.0

ca   /etc/openvpn/pki/ca-racine.pem
cert /etc/openvpn/pki/vpn-server.crt
key  /etc/openvpn/pki/vpn-server.key
dh   none
tls-crypt /etc/openvpn/pki/ta.key

tls-version-min 1.2
data-ciphers AES-256-GCM:CHACHA20-POLY1305
auth SHA256