# sysctl-security.conf - Paramètres du Noyau Linux Sécurisés

# Protection TCP SYN Flood
net.ipv4.tcp_syncookies = 1

# Filtrage Reverse Path (Anti-Spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Refuser les redirections ICMP
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Désactiver le routage IP
net.ipv4.ip_forward = 0

# Randomisation de l'espace mémoire (ASLR niveau 2)
kernel.randomize_va_space = 2
