---
- name: Application du durcissement système Linux (ANSSI / CIS)
  hosts: servers
  become: true

  tasks:
    - name: Déploiement de la configuration SSH durcie
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
        owner: root
        group: root
        mode: '0600'
      notify: Recharger SSH

    - name: Déploiement des paramètres de sécurité du noyau
      ansible.builtin.copy:
        src: sysctl-security.conf
        dest: /etc/sysctl.d/99-security.conf
        owner: root
        group: root
        mode: '0644'

    - name: Rechargement des paramètres sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-security.conf
      changed_when: false

    - name: Installation des paquets de sécurité
      ansible.builtin.apt:
        name:
          - auditd
          - ufw
        state: present
        update_cache: yes

    - name: Activation et démarrage des services de sécurité
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - auditd
        - ufw

  handlers:
    - name: Recharger SSH
      ansible.builtin.systemd:
        name: ssh
        state: reloaded
