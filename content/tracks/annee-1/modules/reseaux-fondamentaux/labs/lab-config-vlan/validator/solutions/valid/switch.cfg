! Configuration Cisco IOS Switch Catalyst
! ---------------------------------------
hostname SW-DISTRIBUTION
!
! 1. Base de donnees VLAN
vlan 10
 name Direction
!
vlan 20
 name Commercial
!
vlan 30
 name Technique
!
vlan 99
 name Administration
!
! 2. Configuration des ports d'acces
interface range FastEthernet0/1 - 4
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
!
interface range FastEthernet0/5 - 8
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
!
interface range FastEthernet0/9 - 12
 switchport mode access
 switchport access vlan 30
 switchport nonegotiate
!
! 3. Configuration du port Trunk
interface GigabitEthernet0/1
 description Trunk vers Routeur
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,99
!
! 4. Interface de gestion SVI et passerelle
interface Vlan 99
 description Interface Gestion Admin
 ip address 192.168.99.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
end
