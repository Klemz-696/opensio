slug: promotion-controleur-domaine
title: "Automatisation du déploiement et promotion d'un contrôleur de domaine AD DS"
level: 2_files
max_score: 100
estimated_minutes: 45
context: |
  Vous devez concevoir un script PowerShell d'automatisation (promote-dc.ps1) permettant d'installer les services de domaine Active Directory (AD DS) et de promouvoir le serveur en premier contrôleur de domaine d'une nouvelle forêt d'entreprise.

  Spécifications du déploiement :
  - Installation du rôle AD-Domain-Services avec ses consoles et outils de gestion (-IncludeManagementTools)
  - Nom FQDN du domaine racine : entreprise.lan
  - Nom NetBIOS du domaine : ENTREPRISE
  - Intégration et installation automatique du rôle DNS (-InstallDns:$true)
  - Chemins standards pour la base (C:\Windows\NTDS), les journaux (C:\Windows\NTDS) et SYSVOL (C:\Windows\SYSVOL)
  - Définition d'un mot de passe DSRM sécurisé via SecureString (ex : ConvertTo-SecureString)
  - Utilisation de la cmdlet Install-ADDSForest avec passage forcé (-Force:$true)

  Complétez le script PowerShell promote-dc.ps1.

objectives:
  - "Automatiser l'installation des composants logiciels du rôle AD DS"
  - "Utiliser la cmdlet Install-ADDSForest avec l'ensemble des paramètres d'infrastructure requis"
  - "Gérer le mot de passe DSRM sous forme de chaîne sécurisée (SecureString)"
  - "Garantir l'installation conjointe du serveur DNS intégré"

prerequisites:
  - ad-ds-et-domaine

topology: null

files:
  editable:
    - path: promote-dc.ps1
      description: "Script PowerShell d'installation et de promotion du contrôleur de domaine"

hints:
  - cost_percent: 10
    text: "Utilisez Install-WindowsFeature -Name AD-Domain-Services -IncludeManagementTools pour installer les binaires."
  - cost_percent: 10
    text: "Générez le mot de passe DSRM avec : $dsrm = ConvertTo-SecureString 'MotDePasse!2026' -AsPlainText -Force."

validation:
  type: script
  image: opensio/validator-powershell:latest
  timeout_seconds: 30
  checks:
    - id: role_installed
      required: true
      points: 30
      description: "Installation du rôle AD-Domain-Services avec outils de gestion"
    - id: adds_forest_configured
      required: true
      points: 45
      description: "Appel de Install-ADDSForest avec le domaine entreprise.lan et NetBIOS ENTREPRISE"
    - id: dsrm_and_options
      required: true
      points: 25
      description: "Configuration du mot de passe DSRM, du rôle DNS intégré et des répertoires NTDS/SYSVOL"

scoring:
  floor_percent: 50
