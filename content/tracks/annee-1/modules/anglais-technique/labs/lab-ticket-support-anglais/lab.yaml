slug: redaction-ticket-support-anglais
title: "Rédaction Professionnelle d'un Ticket de Support en Anglais"
level: 2_files
max_score: 100
estimated_minutes: 40
context: |
  Vous êtes technicien au sein d'un centre de services IT international.
  Un incident critique paralyse l'application ERP : le serveur de base de données PostgreSQL de production (`db-prod-01.corp.lan`) est tombé en panne car son volume de données est saturé à 100 % (`No space left on device`). Plus de 150 collaborateurs sont bloqués.

  Vous avez appliqué un contournement d'urgence en purgeant d'anciens journaux temporaires pour libérer 2 Go, mais le volume doit être étendu de 50 Go par l'équipe d'ingénierie système (`Tier 2 Infrastructure Team`).

  Vous devez rédiger le ticket d'escalade formel en anglais dans le fichier `ticket.md`.

  Structure attendue dans `ticket.md` :
  1. `## Summary` : Résumé explicite en anglais (ex: `[CRITICAL] PostgreSQL service down due to disk saturation on db-prod-01`).
  2. `## Priority` : Sévérité `P1 - Critical` (ou `Critical`).
  3. `## Affected System` : `db-prod-01.corp.lan` (ou `PostgreSQL Database`).
  4. `## Symptoms & Impact` : Symptômes en anglais (service stopped, ERP unreachable, 150 users impacted).
  5. `## Troubleshooting & Workaround` : Analyse technique (disk partition at 100% full, error `No space left on device`, freed 2 GB temporary logs).
  6. `## Action Requested` : Demande claire pour le N2 (expand disk partition by 50 GB, adjust retention policy).

objectives:
  - "Structurer un ticket d'incident ITIL professionnel en anglais"
  - "Qualifier la sévérité et l'impact métier d'une interruption de service"
  - "Documenter les actions de dépannage et le contournement appliqué"
  - "Formuler une demande d'escalade claire et actionnable pour les équipes d'ingénierie"

prerequisites:
  - "tickets-incident-et-support"
  - "vocabulaire-infrastructure-reseau"

files:
  editable:
    - path: ticket.md
      description: "Rapport d'incident et ticket de support technique rédigé en anglais"

hints:
  - cost_percent: 10
    text: "Le ticket doit impérativement être rédigé en anglais technique professionnel."
  - cost_percent: 10
    text: "Déclarez la priorité 'Priority: P1 - Critical' compte tenu des 150 utilisateurs bloqués."
  - cost_percent: 10
    text: "Mentionnez le contournement 'Workaround: Purged 2 GB temporary logs' et la demande 'Action: Expand partition by 50 GB'."

validation:
  type: script
  image: opensio/validator-ticket-en:latest
  timeout_seconds: 30
  checks:
    - id: ticket_structure_and_priority
      required: true
      points: 25
      description: "Structure Markdown complète et niveau de priorité P1 Critical"
    - id: symptoms_and_impact_english
      required: true
      points: 25
      description: "Description des symptômes et de l'impact métier en anglais (ERP, 150 users)"
    - id: troubleshooting_and_workaround
      required: true
      points: 25
      description: "Diagnostic technique et solution de contournement documentés (100% full, 2 GB freed)"
    - id: action_requested_clarity
      required: true
      points: 25
      description: "Demande d'action claire pour l'équipe N2 (expand partition by 50 GB)"

scoring:
  floor_percent: 50
