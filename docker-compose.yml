# docker-compose.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: opensio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opensio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - opensio-postgres:/var/lib/postgresql/data

volumes:
  opensio-postgres: